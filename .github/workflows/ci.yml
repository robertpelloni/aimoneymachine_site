name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'

    # The repo is a go.work workspace with no root module, so tests run
    # per-module over the workspace's actual Use list — including tray,
    # media and publisher, which the old six-line list silently skipped
    # (exactly how placeholder-chain tests rotted). Stub hustle/* modules
    # with a go.mod but no entry in go.work (and no Go code) are excluded
    # by construction; vet inside them errors in workspace mode.
    - name: Vet + test every module
      run: |
        set -e
        for mod in $(go work edit -json | python3 -c "import json,sys; [print(u['DiskPath']) for u in json.load(sys.stdin)['Use']]"); do
          echo "== $mod =="
          (cd "$mod" && go vet ./... && go test ./...)
        done

    - name: Build all binaries
      run: ./build.sh

    - name: Tray compiles
      run: (cd tray && go build ./...)

    - name: Smoke script is valid Python
      run: python3 -m py_compile scripts/smoke_prod.py
