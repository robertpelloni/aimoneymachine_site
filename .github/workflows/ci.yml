name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'

    # The repo is a go.work workspace with no root module, so tests run
    # per-module. Every directory containing a go.mod is covered —
    # including tray, media and publisher, which the old six-line list
    # silently skipped (exactly how placeholder-chain tests rotted).
    - name: Vet + test every module
      run: |
        set -e
        for mod in orchestrator tray hustle/*/; do
          [ -f "$mod/go.mod" ] || continue
          echo "== $mod =="
          (cd "$mod" && go vet ./... && go test ./...)
        done

    - name: Build all binaries
      run: ./build.sh

    - name: Tray compiles
      run: (cd tray && go build ./...)

    - name: Smoke script is valid Python
      run: python3 -m py_compile scripts/smoke_prod.py
